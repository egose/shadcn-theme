packages:
- '@examples/*'
overrides:
  fast-uri: 3.1.5
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  less: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  # puppeteer's postinstall Chrome download stays disabled; the standard
  # example installs its repo-local headless browser via `pnpm install:browser`.
  puppeteer: false
